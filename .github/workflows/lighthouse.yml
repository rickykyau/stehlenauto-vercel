name: Lighthouse CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        id: preview
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600

      - name: Build URL list
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          {
            printf '%s\n' "$PREVIEW_URL"
            printf '%s\n' "$PREVIEW_URL/collections/roof-racks"
            printf '%s\n' "$PREVIEW_URL/products/stehlen-universal-door-frame-mount-roof-rack"
            printf '%s\n' "$PREVIEW_URL/vehicle/ford-f-150"
            printf '%s\n' "$PREVIEW_URL/about"
            printf '%s\n' "$PREVIEW_URL/legal/warranty"
          } > urls.txt
          cat urls.txt

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.preview.outputs.url }}/
            ${{ steps.preview.outputs.url }}/collections/roof-racks
            ${{ steps.preview.outputs.url }}/products/stehlen-universal-door-frame-mount-roof-rack
            ${{ steps.preview.outputs.url }}/vehicle/ford-f-150
            ${{ steps.preview.outputs.url }}/about
            ${{ steps.preview.outputs.url }}/legal/warranty
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
